[project]
name = "snakemake-executor-plugin-finished"
version = "0.1.1"
description = "Snakemake executor plugin that marks targets as finished"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Andrey Rozenberg", email = "alephreish@gmail.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
  "snakemake-interface-common>=1.23.0,<2",
  "snakemake-interface-executor-plugins>=9.0.0,<10",
]

[project.urls]
Repository = "https://github.com/alephreish/snakemake-executor-plugin-finished"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/executor/finished.html"

[dependency-groups]
dev = ["ruff", "coverage", "pytest", "twine", "build", "snakemake"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.tasks]
style = { cmd = "ruff format . --exclude .pixi && ruff check . --exclude .pixi", default-environment = "dev" }

[tool.pixi.pypi-dependencies.snakemake_executor_plugin_finished]
path = "."
editable = true

[tool.pixi.environments.dev]
features = ["dev"]

[tool.pixi.feature.dev.tasks]
lint = "ruff check"
format = "ruff format"
test = "pytest --cov=snakemake-executor-plugin-finished --cov-report=xml:coverage-report/coverage.xml --cov-report=term-missing tests/tests.py"
build = "python -m build"
check-build = { cmd = "python -m twine check dist/*", depends-on = ["build"] }
